name: Android TV / BRAVIA BF1 APK

on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'gradle/**', '*gradle*', 'scripts/check-bravia-apk.py', '.github/workflows/android-bravia.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', '*gradle*', 'scripts/check-bravia-apk.py', '.github/workflows/android-bravia.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Check BRAVIA BF1 packaging
        run: python3 scripts/check-bravia-apk.py app/build/outputs/apk/debug/app-debug.apk --build-tools "$ANDROID_HOME/build-tools/34.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: Vistaar-BRAVIA-BF1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
